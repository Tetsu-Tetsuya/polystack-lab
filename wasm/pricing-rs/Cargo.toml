[package]
name = "pricing-rs"
version = "0.1.0"
edition = "2021"
description = "Prévia de preço do PolyStack Lab, compilada para WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
